[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "askr"
version = "0.2.0"
description = "Simple, validated input prompts for the terminal"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Prevolut Ltd" }]
keywords = ["input", "prompt", "cli", "terminal", "validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Prevolut/askr"
Source = "https://github.com/Prevolut/askr"
Issues = "https://github.com/Prevolut/askr/issues"
Changelog = "https://github.com/Prevolut/askr/blob/main/CHANGELOG.md"
